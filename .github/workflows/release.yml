name: release

# 打 v* tag 即触发完整发布: test + build + 交叉编译 6 目标 + 上传 GitHub Release。
# 库与 CLI 共用一个版本号; cmd/gs/v* tag 只是供 `go install` 解析 CLI module 版本,
# 不再单独触发 workflow (见 scripts/release.sh)。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test & build
        run: |
          go test ./...
          (cd cmd/gs && go vet ./... && go test ./... && go build ./...)

      - name: Cross-compile all targets
        env:
          CGO_ENABLED: '0'
          LDFLAGS: '-s -w'
        run: |
          mkdir -p dist
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              ext=""
              if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
              out="gs-${GOOS}-${GOARCH}${ext}"
              echo "building dist/${out}"
              (cd cmd/gs && CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -trimpath -ldflags="${LDFLAGS}" -o "../../dist/${out}" .)
            done
          done
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -l dist

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
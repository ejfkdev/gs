name: release

# 打 tag 即触发：
#   - v*          : 库版本 —— 只做 test + CLI 编译 sanity, 不发二进制
#   - cmd/gs/v*   : CLI 版本 —— 全目标交叉编译并上传 GitHub Release
# 避免同时打两个 tag 时产生两份重复 Release。
on:
  push:
    tags:
      - 'v*'
      - 'cmd/gs/v*'

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test & build (both library and CLI tags)
        run: |
          go test ./...
          (cd cmd/gs && go vet ./... && go test ./... && go build ./...)

      - name: Cross-compile all targets (CLI release only)
        if: startsWith(github.ref, 'refs/tags/cmd/gs/v')
        env:
          CGO_ENABLED: '0'
          LDFLAGS: '-s -w'
        run: |
          mkdir -p dist
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              ext=""
              if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
              out="gs-${GOOS}-${GOARCH}${ext}"
              echo "building dist/${out}"
              (cd cmd/gs && CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -trimpath -ldflags="${LDFLAGS}" -o "../../dist/${out}" .)
            done
          done
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -l dist

      - name: Upload binaries to release (CLI release only)
        if: startsWith(github.ref, 'refs/tags/cmd/gs/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true